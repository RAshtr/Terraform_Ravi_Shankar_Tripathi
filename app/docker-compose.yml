version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flask_backend_service
    ports:
      - "5000:5000"
    networks:
      - fullstack_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: express_frontend_service
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:5000
    depends_on:
      - backend
    networks:
      - fullstack_net

networks:
  fullstack_net:
    driver: bridge