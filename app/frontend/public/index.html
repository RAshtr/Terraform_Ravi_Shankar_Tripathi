<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Form</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .box { max-width: 420px; padding: 25px; border: 1px solid #ccc; border-radius: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        #responseBox { margin-top: 20px; padding: 10px; border-radius: 4px; display: none; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Contact Form</h2>
        <form id="contactForm">
            <div class="form-group">
                <label>Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Message:</label>
                <textarea id="message" name="message" rows="3" required></textarea>
            </div>
            <button type="submit">Submit Details</button>
        </form>
        <div id="responseBox"></div>
    </div>

    <script>
        document.getElementById('contactForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const resBox = document.getElementById('responseBox');
            const payload = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                message: document.getElementById('message').value
            };

            try {
                const res = await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                resBox.style.display = 'block';
                if (res.ok) {
                    resBox.className = 'success';
                    resBox.innerHTML = '<strong>Success:</strong> ' + data.message;
                    document.getElementById('contactForm').reset();
                } else {
                    resBox.className = 'error';
                    resBox.innerHTML = '<strong>Error:</strong> ' + data.message;
                }
            } catch (err) {
                resBox.style.display = 'block';
                resBox.className = 'error';
                resBox.innerHTML = '<strong>Error:</strong> Failed to reach server.';
            }
        });
    </script>
</body>
</html>
